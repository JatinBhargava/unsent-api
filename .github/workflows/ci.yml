name: Unsent CI Pipeline

on:
  push:
    branches:
      - feature/**
      - develop
      - master
      - release/**
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      create_tag:
        description: Create a git tag from POM version
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: jatindocker623

jobs:
  build:
    name: Build & Test (All Modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test
        run: ./mvnw clean verify

      - name: Check Build Status
        if: failure()
        run: |
          echo "❌ Build or tests failed! PR cannot be merged."
          exit 1

  docker:
    name: Build & Push Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')

    env:
      APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
      FRONTEND_LOGIN_PATH: /

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Package
        run: ./mvnw clean package -DskipTests

      - name: Resolve Version
        run: |
          echo "VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker Images
        run: |
          docker build -f unsent-api/Dockerfile \
            -t $DOCKER_REGISTRY/unsent-api:$VERSION .

          docker build -f unsent-listener/Dockerfile \
            -t $DOCKER_REGISTRY/unsent-listener:$VERSION .

          docker build -f unsent-batch/Dockerfile \
            -t $DOCKER_REGISTRY/unsent-batch:$VERSION .

      - name: Push Docker Images
        run: |
          docker push $DOCKER_REGISTRY/unsent-api:$VERSION
          docker push $DOCKER_REGISTRY/unsent-listener:$VERSION
          docker push $DOCKER_REGISTRY/unsent-batch:$VERSION

  tag:
    name: Create Git Tag from POM Version
    needs: docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') || inputs.create_tag == true
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve Version
        run: |
          echo "VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"