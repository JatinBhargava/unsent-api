name: Unsent CI Pipeline

on:
  push:
    branches:
      - feature/**
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

env:
  DOCKER_REGISTRY: jatindocker623

jobs:
  build:
    name: Build & Test (All Modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw -version

      - name: Build & Test (feature/develop/master)
        run: ./mvnw clean verify

  docker:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve Version
        id: version
        run: |
          echo "VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Images
        run: |
          docker build -t $DOCKER_REGISTRY/unsent-api:$VERSION unsent-api
          docker build -t $DOCKER_REGISTRY/unsent-listener:$VERSION unsent-listener
          docker build -t $DOCKER_REGISTRY/unsent-batch:$VERSION unsent-batch

      - name: Push Images (feature/master)
        # if: github.ref == 'refs/heads/master'
        run: |
          docker push $DOCKER_REGISTRY/unsent-api:$VERSION
          docker push $DOCKER_REGISTRY/unsent-listener:$VERSION
          docker push $DOCKER_REGISTRY/unsent-batch:$VERSION
