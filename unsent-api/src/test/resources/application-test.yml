spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  # application.yml requires MAIL_* to be present, so the test profile supplies
  # its own. Nothing here connects — PostcardServiceTest stubs the sender.
  mail:
    host: smtp.test
    username: test
    password: test

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  frontend-url: ${APP_FRONTEND_URL:https}
  frontend-login-path: ${FRONTEND_LOGIN_PATH:/}
  jwt:
    secret: test-test-test-test-test-test-test-test
    expiration-ms: 86400000
