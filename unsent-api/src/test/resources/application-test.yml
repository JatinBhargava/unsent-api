spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  frontend-url: ${APP_FRONTEND_URL:https://unsent-ui.vercel.app}
  frontend-login-path: ${FRONTEND_LOGIN_PATH:/}
  jwt:
    secret: test-test-test-test-test-test-test-test
    expiration-ms: 86400000
