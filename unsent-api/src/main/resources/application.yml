spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  application:
    name: unsent-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/unsent_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope:
              - email
              - profile

  mail:
    # Empty defaults on purpose: an instance with no SMTP settings must still boot.
    # Postcards then fail per-request with a clear message instead of taking the API down.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  main:
    allow-circular-references: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cache: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  frontend-url: ${APP_FRONTEND_URL}
  frontend-login-path: ${FRONTEND_LOGIN_PATH:/}
  jwt:
    expiration-ms: 86400000
  ai:
    openai-key: ${OPENAI_API_KEY}
  postcard:
    from-address: ${POSTCARD_FROM_ADDRESS}
    from-name: ${POSTCARD_FROM_NAME:Unsent}
    max-per-hour: ${POSTCARD_MAX_PER_HOUR:10}
    send-as-user: ${POSTCARD_SEND_AS_USER:false}
