version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: unsent-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: jatindocker623/unsent-api:1.0.0-SNAPSHOT
    container_name: unsent-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  listener:
    image: jatindocker623/unsent-listener:1.0.0-SNAPSHOT
    container_name: unsent-listener
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  batch:
    image: jatindocker623/unsent-batch:1.0.0-SNAPSHOT
    container_name: unsent-batch
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8084:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  jenkins_data: